name: Create repo diagram
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  diagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: githubocto/repo-visualizer@main
        with:
          output_file: diagram.svg
          excluded_globs: "**/__pycache__/**;reports/**;audit.jsonl"
          file_colors: '{"py":"#3776AB","md":"#7F77DD","sh":"#1D9E75","jsonl":"#888780"}'
          max_depth: 5
