name: Create repo diagram
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  diagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: githubocto/repo-visualizer@main
        with:
          output_file: diagram.svg
          excluded_paths: ".github"
          excluded_globs: "diagram.svg;.gitignore;**/__pycache__/**"
          max_depth: 4
          file_colors: '{"py":"#0078D4","md":"#5C2D91","sh":"#107C10","txt":"#CA5010","json":"#243A5E","jsonl":"#243A5E","svg":"#8A8886"}'
